apiVersion: v1
kind: Pod
metadata:
  labels:
    run: reservas-db
  name: reservas-db
spec:
  containers:
  - image: mysql:8.4
    name: reservas-db
    ports:
      - containerPort: 3306
    env:
      - name: MYSQL_ROOT_PASSWORD
        value: "reservas_root_pass"
      - name: MYSQL_DATABASE
        value: "reservasdb"
      - name: MYSQL_USER
        value: "reservas_user"
      - name: MYSQL_PASSWORD
        value: "reservas_pass"
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
