apiVersion: v1
kind: Pod
metadata:
  labels:
    run: reservas-api
  name: reservas-api
spec:
  containers:
  - image: mbraian/reservas-api:v1
    name: reservas-api
    # ports:
    #   - containerPort: 3000
    env:
      - name: PORT
        value: "3000"
      - name: DB_HOST
        value: "reservas-db"
      - name: DB_PORT
        value: "3306"
      - name: DB_NAME
        value: "reservasdb"
      - name: DB_USER
        value: "reservas_user"
      - name: DB_PASSWORD
        value: "reservas_pass"
      - name: APP_VERSION
        value: "v5"
      - name: SEED_DEMO
        value: "true"
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
