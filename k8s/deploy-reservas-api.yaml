apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservas-api
  name: reservas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-api
  strategy: {}
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      containers:
      - image: mbraian/reservas-api:v1
        name: reservas-api
        ports:
          - containerPort: 3000
        env:
          - name: PORT
            value: "3000"
          - name: DB_HOST
            value: "reservas-db"
          - name: DB_PORT
            value: "3306"
          - name: DB_NAME
            value: "reservasdb"
          - name: DB_USER
            value: "reservas_user"
          - name: DB_PASSWORD
            value: "reservas_pass"
          - name: APP_VERSION # Se la comenta, para evitar la precedencia y que nunca se muestre 'v2' en el frontend
            value: "v1"
          - name: SEED_DEMO
            value: "true"
        resources: {}
status: {}
